# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      sanity:
        patterns:
          - "sanity"
          - "@sanity/*"
          - "next-sanity"
      trpc:
        patterns:
          - "@trpc/*"
          - "@tanstack/react-query"
          - "superjson"
      algolia:
        patterns:
          - "@algolia/*"
          - "algoliasearch"
          - "instantsearch.js"
          - "react-instantsearch"
      radix-ui:
        patterns:
          - "@radix-ui/*"
          - "radix-ui"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      typescript-tooling:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/*"
          - "eslint"
      styling:
        patterns:
          - "tailwindcss"
          - "tailwind-merge"
          - "tailwindcss-animate"
          - "prettier"
          - "prettier-plugin-tailwindcss"
          - "class-variance-authority"
          - "clsx"
