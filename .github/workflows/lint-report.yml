name: Lint Report
on:
  pull_request:
  push:
    branches: [ ${{ github.event.repository.default_branch }} ]

permissions:
  contents: read

jobs:
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        # Using --max-warnings=-1 to never fail on warnings
        # Using continue-on-error: true to never fail the workflow
        continue-on-error: true
        run: npm run lint -- --format stylish --no-fix --max-warnings=-1
        
      - name: Add Lint Summary
        run: |
          echo "## ESLint Report Summary" >> $GITHUB_STEP_SUMMARY
          npm run lint -- --format stylish --no-fix --max-warnings=-1 >> $GITHUB_STEP_SUMMARY || true 